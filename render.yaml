# Render blueprint. In Render: New -> Blueprint -> pick this repo.
# Everything below is applied automatically; no manual settings needed.
#
# The free plan has no persistent disk, so SEED_ON_START refills the demo data
# after every restart and the dashboard is never empty for a visitor.

services:
  - type: web
    name: ai-support-agent
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: demo
      - key: SEED_ON_START
        value: "true"
      - key: COMPANY_NAME
        value: Northwind Coffee Co.
      - key: AGENT_NAME
        value: Nora
      # Render asks you for this during deploy. Pick your own and remember it -
      # it is the password for /admin.
      - key: ADMIN_TOKEN
        sync: false
      # Add ANTHROPIC_API_KEY / OPENAI_API_KEY in the Render UI when you are
      # ready to switch LLM_PROVIDER away from demo. Never commit keys.
